<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IBP OS — Sign in</title>
<style>
:root{--bg:#f5f7f7;--card:#fff;--text:#18302d;--muted:#879491;--line:#e6ecea;--accent:#0d4b43;--purple:#efeafd}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f5f7f7,#eef5f2);font-family:Inter,system-ui,sans-serif;color:var(--text);padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 12px 40px rgba(21,48,45,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:42px;height:42px;border-radius:12px;background:var(--purple);display:grid;place-items:center;color:#5b46a8;font-size:20px}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.tabs{display:flex;gap:8px;margin-bottom:22px}.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;color:#65736f}.tabs button.active{background:#edf5f2;color:var(--accent);font-weight:700}.form{display:grid;gap:13px}.form label{font-size:11px;color:#66736f}.form input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none}.primary{border:0;border-radius:10px;padding:12px;background:var(--accent);color:#fff;font-weight:700;margin-top:5px}.message{font-size:11px;padding:10px;border-radius:10px;margin-bottom:12px}.error{background:#fff1f1;color:#a14f4f}.success{background:#eef8f1;color:#287457}.muted{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:20px}.hidden{display:none}</style>
</head><body>
<div class="card"><div class="brand"><div class="mark">✦</div><div><strong>IBP OS</strong><small>Lead workspace</small></div></div>
<div class="tabs"><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></div>
<div id="message"></div>
<form id="form" class="form"><div id="nameWrap" class="hidden"><label>Full name</label><input id="name" autocomplete="name"></div><div><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div><label>Password</label><input id="password" type="password" minlength="6" required autocomplete="current-password"></div><button id="submit" class="primary" type="submit">Sign in</button></form>
<p class="muted" style="margin-top:18px;margin-bottom:0">Your account is handled by Supabase Authentication. You do not need to enter any API key here.</p></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './supabase-config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let register=false;const $=id=>document.getElementById(id);
function mode(v){register=v;$('loginTab').classList.toggle('active',!v);$('registerTab').classList.toggle('active',v);$('nameWrap').classList.toggle('hidden',!v);$('name').required=v;$('submit').textContent=v?'Create account':'Sign in';$('message').innerHTML='';}
$('loginTab').onclick=()=>mode(false);$('registerTab').onclick=()=>mode(true);
$('form').onsubmit=async e=>{e.preventDefault();$('message').innerHTML='';const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();let r;if(register)r=await supabase.auth.signUp({email,password,options:{data:{full_name:name}}});else r=await supabase.auth.signInWithPassword({email,password});if(r.error){$('message').innerHTML='<div class="message error">'+r.error.message+'</div>';return}if(register&&!r.data.session){$('message').innerHTML='<div class="message success">Account created. Check your email to confirm it, then sign in.</div>';return}location.href='./index.html';};
const {data:{session}}=await supabase.auth.getSession();if(session)location.href='./index.html';
</script></body></html>
